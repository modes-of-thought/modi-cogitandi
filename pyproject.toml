[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "modi-cogitandi"
version = "0.0.1"
authors = [
    {name="Machina Ratiocinatrix", email="machina.ratio@gmail.com"},
    {name="Alexander Fedotov", email="alex.fedotov@aol.com"}
]
description = "Modes of thought."
readme = "README.md"
requires-python = ">=3.10"
classifiers=[
        "Programming Language :: Python :: 3",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
]
keywords = ["modi-cogitandi"]
dependencies = [
    "pyyaml == 6.0.3"
]

[project.scripts]
modi-cogitandi = "modi_cogitandi.cli:run"

[project.urls]
"Homepage" = "https://github.com/modi-cogitandi/modi-cogitandi"

[dependency-groups]
dev = ["pytest>=8.0.0"]